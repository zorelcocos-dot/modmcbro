name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate and validate assets
        run: |
          pip install pillow
          python generate_assets.py

      - name: List available GeckoLib versions
        run: |
          for a in geckolib-fabric-1.21.1 geckolib-fabric-1.21; do
            echo "== $a"
            curl -s https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/$a/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -15
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: arcaneforge-jar
          path: build/libs/*.jar
